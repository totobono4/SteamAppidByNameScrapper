name: SteamAppidByNameScrapper

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Update steam_games.json
      env:
        STEAM_KEY: ${{ secrets.STEAM_KEY }}
      run: |
        python main.py
    - name: Commit steam_games.json
      run: |
        git commit -m "$(date "+%D %T") updated steam_games.json" steam_games.json
